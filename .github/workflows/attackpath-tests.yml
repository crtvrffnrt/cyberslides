name: Attack Path tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/attack-path-training]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: HTTP smoke test
        run: |
          set -euo pipefail
          PORT=9876 node server.js >/tmp/cyberslides.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9876/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9876/api/health | grep -q '"ok": true'
          curl -fsS http://127.0.0.1:9876/attackpath | grep -q 'Create guided assessment'
          curl -fsS http://127.0.0.1:9876/api/attackpath/projects | grep -q '"projects"'
          curl -fsS http://127.0.0.1:9876/ | grep -q 'attackpath-overlay.js'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9876/server.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9876/attackpath-data/abc.json)" = 404
      - name: Authenticated LAN listener smoke test
        run: |
          set -euo pipefail
          HOST=0.0.0.0 PORT=9877 CYBERSLIDES_ACCESS_TOKEN=test-operator-token-12345678 CYBERSLIDES_VIEWER_TOKEN=test-viewer-token-12345678 node server.js >/tmp/cyberslides-lan.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9877/api/health)" = "401"; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9877/api/health)" = "401"
          curl -fsS -c /tmp/cyber-cookie -H 'content-type: application/json' \
            -d '{"token":"test-operator-token-12345678"}' http://127.0.0.1:9877/api/login
          curl -fsS -b /tmp/cyber-cookie http://127.0.0.1:9877/api/health | grep -q '"ok": true'
          test "$(curl -s -b /tmp/cyber-cookie -H 'Origin: http://evil.invalid' \
            -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:9877/api/presentation)" = "403"
